name: APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ordenar archivos
        run: |
          mkdir -p www assets
          cp index.html www/index.html
          cp icon-only.png icon-foreground.png icon-background.png splash.png splash-dark.png assets/

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

     

      - name: Dependencias
        run: npm install

      - name: Proyecto Android
        run: |
          npx cap add android
          bash ./patch-android.sh
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renombrar
        run: cp android/app/build/outputs/apk/debug/app-debug.apk hockey-linces.apk

      - uses: actions/upload-artifact@v4
        with:
          name: hockey-linces-apk
          path: hockey-linces.apk
